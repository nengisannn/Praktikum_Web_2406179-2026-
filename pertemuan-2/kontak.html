<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portofolio Neng</title>
    <h1>HALAMAN KONTAK SAYA</h1>
</head>
<body>
  <header>
    <h1>Kontak Saya</h1>
    <hr>
    <main>
        <section>
            <h2>Kirimkan Penawaran Anda:</h2>
            <from action="">
                <label for="nama_pengirim">Nama</label>
                <input type="text" id="nama_pengirim">
            </from>

            <br>

            <from action="">
                <label for="email_pengirim">Email</label>
                <input type="email" name="Email" id="email_pengiriman">
            </from> 
            <p>
                <label for="jenis_layanan">Layanan Yang Dibutuhkan</label>
                <select name="jenis_layanan" id="jenis_layanan">
                    <option value="">--Pilih Layanan</option>
                    <option value="web">Pembuatan Web</option>
                    <option value="Aplikasi">Pembuatan aplikasi</option>
                    <option value="Lainnya">Lain-lain</option>
                </select>
            </p>
            <p>
                <label for="pesan">Pesan</label>
                <textarea name="Pesan" id="pesan" rows="6"></textarea>
            </p>
            <button type="submit">kirim pesan</button>
            <button type="reset">batal / reset</button>

        </section>
    </main>

</body>
</html>
